<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>六花亭のマルセイバターサンド争奪戦！！｜あみだくじ</title>
<style>
  :root{
    --indigo:#131c31; --indigo-2:#1b2742; --line:#2a3a5f;
    --washi:#f4ecdd; --washi-2:#ece0cb; --sumi:#26303f;
    --shu:#d02b3a;           /* 朱色：当たり */
    --shu-deep:#b21f2d;
    --slate:#5f6b7e;         /* はずれ */
    --gold:#c79a3f;
    --ink-line:#7b8bab;
    --cream:#f4ecdd;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP","Meiryo",sans-serif;
    color:var(--cream);
    background:
      radial-gradient(rgba(255,255,255,.035) 1.4px, transparent 1.7px) 0 0/26px 26px,
      radial-gradient(120% 80% at 50% -10%, #223258 0%, var(--indigo) 55%, #0e1526 100%);
    min-height:100dvh;
    line-height:1.5;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:560px;position:relative;z-index:1;}

  header{text-align:center;margin:6px 0 18px;}
  .eyebrow{
    font-size:11px;letter-spacing:.2em;color:var(--gold);
    font-weight:700;padding-left:.2em;
  }
  h1{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
    font-weight:800;margin:.1em 0 .1em;line-height:1.18;letter-spacing:.03em;
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  h1 .line1{
    display:block;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:700;font-size:clamp(23px,7vw,34px);letter-spacing:.02em;line-height:1.24;
    color:#ecdcbe;padding-left:.02em;
  }
  h1 .line2{display:block;font-size:clamp(28px,8vw,42px);letter-spacing:.06em;margin-top:.12em;}
  h1 .dot{color:var(--shu);}
  h1 .bang{color:var(--gold);}
  .scene{margin:14px auto 8px;max-width:460px;}
  .scene-img{width:100%;height:auto;display:block;border-radius:14px;
    box-shadow:0 12px 26px rgba(0,0,0,.42), inset 0 0 0 1px rgba(255,255,255,.14);}
  .bg-decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-decor img{position:absolute;opacity:.14;
    -webkit-mask-image:radial-gradient(ellipse at 50% 48%, #000 48%, transparent 76%);
            mask-image:radial-gradient(ellipse at 50% 48%, #000 48%, transparent 76%);}
  .bd1{width:190px;left:-40px;bottom:2px;transform:rotate(-7deg);}     /* 温泡：左下 */
  .bd2{width:135px;right:-34px;top:70px;transform:rotate(8deg);}       /* お茶：右上 */
  .bd3{width:150px;right:-38px;bottom:8px;transform:rotate(-6deg);}    /* お茶：右下 */
  .bd4{width:150px;left:-34px;top:78px;transform:rotate(6deg);}        /* 温泡：左上 */
  .sub{font-size:13.5px;color:#c3ccdf;}
  .sub b{color:var(--cream);}
  .rule{
    width:56px;height:3px;margin:12px auto 0;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }

  .panel{
    position:relative;z-index:0;
    background:linear-gradient(180deg,var(--washi),var(--washi-2));
    border-radius:16px;padding:16px 14px 14px;
    box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.4);
    color:var(--sumi);
  }
  /* あみだ盤の内側にうっすら重ねる商品画像（番号・線より後ろ） */
  .panel-decor{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;border-radius:16px;}
  .panel-decor img{position:absolute;opacity:.15;}
  .pd-big{width:98%;left:1%;top:50%;transform:translateY(-50%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 50%, #000 56%, transparent 85%);
            mask-image:radial-gradient(ellipse at 50% 50%, #000 56%, transparent 85%);}
  .page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-repeat:no-repeat;
    background-position:center 26%;background-size:min(155%,860px);opacity:.08;}
  .panel-label{
    font-size:12px;font-weight:800;letter-spacing:.18em;color:#8a5a2b;
    display:flex;align-items:center;gap:8px;margin:0 2px 12px;
  }
  .panel-label::after{content:"";flex:1;height:1px;background:rgba(138,90,43,.28);}

  /* 番号ピッカー */
  .pick{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));
    gap:8px;
  }
  .num{
    appearance:none;border:1.5px solid #d9c9ad;background:#fbf6ec;
    color:var(--sumi);font-weight:700;font-size:16px;
    height:46px;border-radius:11px;cursor:pointer;
    font-variant-numeric:tabular-nums;
    transition:transform .08s, background .15s, border-color .15s, color .15s;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .num:hover{border-color:var(--gold);}
  .num:active{transform:translateY(1px) scale(.97);}
  .num:focus-visible{outline:3px solid rgba(199,154,63,.6);outline-offset:2px;}
  .num.done{background:#e9dec9;color:#a99a80;border-color:#e2d5bd;}
  .num.done::after{content:"✓";font-size:11px;position:relative;top:-8px;left:2px;color:var(--slate);}
  .num.active{background:var(--shu);border-color:var(--shu-deep);color:#fff;box-shadow:0 3px 10px rgba(208,43,58,.4);}

  /* あみだ盤 */
  .board{margin-top:14px;}
  .ladder-wrap{
    background:#fbf6ec;border-radius:12px;padding:10px 8px;
    box-shadow:inset 0 0 0 1px rgba(138,90,43,.14), inset 0 2px 10px rgba(120,90,40,.06);
  }
  svg{display:block;width:100%;height:auto;}
  .col{stroke:var(--ink-line);stroke-width:2;stroke-linecap:round;}
  .rung{stroke:var(--ink-line);stroke-width:2;stroke-linecap:round;}
  .cap{fill:#c9b48f;}
  .cap.hit{fill:var(--shu);}
  .cap.miss{fill:var(--slate);}
  .startlbl{fill:#9b8153;font-size:13px;font-weight:700;text-anchor:middle;font-family:inherit;}
  #trace{fill:none;stroke:var(--shu);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;
         filter:drop-shadow(0 1px 2px rgba(208,43,58,.35));}
  #tip{fill:#fff;stroke:var(--shu);stroke-width:3;}

  /* 結果スタンプ */
  .result{margin-top:14px;min-height:0;text-align:center;}
  .result.show{margin-top:16px;}
  .banner{font-size:15px;color:#5a4a30;font-weight:700;opacity:0;transition:opacity .3s;}
  .banner.show{opacity:1;}
  .banner b{font-size:18px;}
  .stamp-row{display:flex;justify-content:center;margin-top:10px;}
  .stamp{
    width:120px;height:120px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    transform:scale(.2) rotate(-18deg);opacity:0;
  }
  .stamp.pop{animation:stamp .5s cubic-bezier(.2,1.5,.4,1) forwards;}
  @keyframes stamp{60%{transform:scale(1.08) rotate(4deg);opacity:1;}100%{transform:scale(1) rotate(-3deg);opacity:1;}}
  .stamp.hit{
    color:var(--shu);border:4px solid var(--shu);
    box-shadow:0 0 0 5px #fbf6ec, 0 0 0 7px var(--shu), 0 10px 24px rgba(208,43,58,.35);
    background:radial-gradient(circle at 50% 40%, #fff 60%, #fdeced);
  }
  .stamp.hit .big{font-size:52px;font-weight:700;line-height:1;letter-spacing:.05em;}
  .stamp.hit .small{font-size:12px;font-weight:700;margin-top:4px;letter-spacing:.04em;line-height:1.3;text-align:center;}
  .stamp.miss{
    color:var(--slate);border:4px dashed #aab2be;background:#f2f0ec;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
  }
  .stamp.miss .big{font-size:30px;font-weight:700;letter-spacing:.14em;padding-left:.14em;}
  /* 賞品スタンプ（お茶／入浴剤） */
  .stamp.tea{
    color:#2f8f52;border:4px solid #2f8f52;
    box-shadow:0 0 0 5px #fbf6ec, 0 0 0 7px #2f8f52, 0 10px 24px rgba(47,143,82,.32);
    background:radial-gradient(circle at 50% 40%, #fff 58%, #e9f6ec);
  }
  .stamp.bath{
    color:#7a5cc4;border:4px solid #7a5cc4;
    box-shadow:0 0 0 5px #fbf6ec, 0 0 0 7px #7a5cc4, 0 10px 24px rgba(122,92,196,.32);
    background:radial-gradient(circle at 50% 40%, #fff 58%, #f0ebfb);
  }
  .stamp.win{padding:6px;text-align:center;}
  .stamp.win .emoji{font-size:38px;line-height:1;}
  .stamp.win .prize-img{height:50px;width:auto;max-width:92px;object-fit:contain;display:block;margin:0 auto 2px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.18));}
  .stamp.win .big{font-size:16px;font-weight:800;line-height:1.15;margin-top:4px;letter-spacing:0;white-space:nowrap;}
  .stamp.win .small{font-size:10px;font-weight:700;margin-top:3px;letter-spacing:.02em;line-height:1.2;text-align:center;max-width:106px;opacity:.9;}
  .ring.tea{border-color:#2f8f52;}
  .ring.bath{border-color:#7a5cc4;}
  .ring{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid var(--shu);
        opacity:0;pointer-events:none;}
  .ring.go{animation:ring .7s ease-out .15s;}
  @keyframes ring{0%{transform:scale(.9);opacity:.55;}100%{transform:scale(1.9);opacity:0;}}
  .stamp-stage{position:relative;display:flex;align-items:center;justify-content:center;}

  .actions{display:flex;gap:10px;justify-content:center;margin-top:16px;opacity:0;transition:opacity .3s;}
  .actions.show{opacity:1;}
  .btn{
    appearance:none;border:0;cursor:pointer;font-weight:700;font-size:14px;
    padding:11px 18px;border-radius:999px;font-family:inherit;
  }
  .btn.ghost{background:#e7dcc7;color:#6b5330;}
  .btn.ghost:active{transform:translateY(1px);}
  .btn:focus-visible{outline:3px solid rgba(199,154,63,.7);outline-offset:2px;}

  .foot{margin-top:18px;text-align:center;font-size:11.5px;color:#8e99b0;line-height:1.7;}
  .tally{font-size:12px;color:#9aa4ba;text-align:center;margin-top:10px;}
  .tally b{color:var(--cream);}
  .fullreset-wrap{text-align:center;margin-top:8px;}
  .fullreset{
    appearance:none;background:transparent;border:1px solid rgba(233,222,201,.28);
    color:#c3ccdf;font-family:inherit;font-size:12px;font-weight:700;
    padding:7px 14px;border-radius:999px;cursor:pointer;letter-spacing:.04em;
  }
  .fullreset:hover{border-color:var(--gold);color:var(--cream);}
  .fullreset:active{transform:translateY(1px);}
  .fullreset:focus-visible{outline:3px solid rgba(199,154,63,.6);outline-offset:2px;}

  /* 共有バー・結果ボード */
  .share{display:flex;gap:8px;align-items:center;margin:0 2px 12px;flex-wrap:wrap;}
  .share-status{font-size:11.5px;font-weight:700;color:#9a6b2b;background:#f3e7cf;
    border:1px solid #e4d3b0;border-radius:999px;padding:5px 10px;white-space:nowrap;}
  .share-status.ok{color:#2f7d4f;background:#e6f3ea;border-color:#bfe2cb;}
  .name-input{flex:1;min-width:130px;height:38px;border:1.5px solid #d9c9ad;border-radius:10px;
    padding:0 12px;font-family:inherit;font-size:15px;color:var(--sumi);background:#fbf6ec;}
  .name-input:focus{outline:none;border-color:var(--gold);}
  .name-input.need{border-color:var(--shu);background:#fdeef0;animation:nameshake .35s;}
  @keyframes nameshake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .name-hint{display:none;flex-basis:100%;font-size:11.5px;font-weight:700;color:var(--shu-deep);margin:1px 2px 0;}
  .name-hint.show{display:block;}
  .num.taken{background:#e7dcc6;border-color:#e0d2b6;color:#9c8c6f;}
  .num.taken::after{content:"済";position:absolute;top:-7px;right:-5px;font-size:9px;font-weight:800;
    background:var(--slate);color:#fff;border-radius:6px;padding:1px 4px;line-height:1.2;}
  .num{position:relative;}
  .num.taken.taken-hit::after{content:"当";background:var(--shu);}
  .banner .note{font-size:12px;color:#9a6b2b;font-weight:600;}
  .live{margin-top:14px;background:#fbf6ec;border-radius:12px;padding:11px 12px;
    box-shadow:inset 0 0 0 1px rgba(138,90,43,.14);}
  .live-head{font-size:12px;font-weight:800;letter-spacing:.14em;color:#8a5a2b;margin-bottom:9px;
    display:flex;align-items:center;gap:8px;}
  .live-head::after{content:"";flex:1;height:1px;background:rgba(138,90,43,.28);}
  .live-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .live-empty{font-size:12px;color:#9b8c72;}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
    border-radius:999px;padding:4px 9px;background:#f1e7d3;color:#6b5330;border:1px solid #e2d3b4;
    font-variant-numeric:tabular-nums;}
  .chip .who{font-weight:600;color:#7a6a4c;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chip .res{font-weight:800;}
  .chip.tea{background:#e7f5ea;border-color:#c3e6cd;color:#2f7d4f;}
  .chip.tea .res{color:#2f8f52;}
  .chip.bath{background:#efeafa;border-color:#d8ccf2;color:#5f4aa0;}
  .chip.bath .res{color:#7a5cc4;}
  .chip.miss{color:#5f6b7e;}
  .org-reset{margin-top:14px;text-align:center;}
  .org-reset button{appearance:none;background:transparent;border:1px dashed rgba(178,31,45,.45);
    color:#b21f2d;font-size:11.5px;font-weight:700;border-radius:999px;padding:6px 13px;cursor:pointer;
    font-family:inherit;letter-spacing:.03em;}
  .org-reset button:active{transform:translateY(1px);}
  .org-reset button:focus-visible{outline:3px solid rgba(178,31,45,.45);outline-offset:2px;}

  /* 広告風ヘッダーバナー */
  .ad{position:relative;container-type:inline-size;width:100%;aspect-ratio:900/520;
    border-radius:16px;overflow:hidden;background-color:#241610;background-size:cover;background-position:center;
    box-shadow:0 12px 30px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.08);margin-bottom:10px;}
  .ad-logo{position:absolute;top:5%;left:3.2%;background:#fbf6ec;color:#2a1c12;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;
    font-size:4.4cqw;letter-spacing:.14em;padding:.3em .55em .26em;border-radius:5px;
    box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .ad-eyebrow{position:absolute;top:8%;right:4%;color:#ecdcbe;font-size:2.8cqw;font-weight:700;
    letter-spacing:.06em;white-space:nowrap;display:flex;align-items:center;}
  .ad-eyebrow::before{content:"";width:6cqw;margin-right:.6em;border-top:1.5px dotted #b79a6a;}
  .ad-title{position:absolute;right:4%;top:23%;width:64%;text-align:right;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.05;
    text-shadow:0 2px 7px rgba(0,0,0,.5);}
  .ad-l0{display:block;color:#f0e4cf;font-weight:700;font-size:4.6cqw;letter-spacing:.06em;margin-bottom:.12em;}
  .ad-l1,.ad-l2{display:block;color:#fff;font-weight:800;font-size:8.6cqw;letter-spacing:.01em;}
  .ad-l3{display:block;color:#e8392c;font-weight:900;font-size:9cqw;letter-spacing:.04em;margin-top:.06em;
    text-shadow:0 2px 9px rgba(0,0,0,.55);}
  .ad-tag{position:absolute;left:3.2%;bottom:6%;background:#c0272d;color:#fff;
    font-size:3cqw;font-weight:800;letter-spacing:.04em;padding:.4em .68em;border-radius:5px;
    box-shadow:0 3px 8px rgba(0,0,0,.4);}
  .ad-tag b{font-size:1.3em;margin:0 .05em;}

  .panel-note{position:relative;z-index:1;font-size:13px;line-height:1.65;color:#6b5330;font-weight:600;
    text-align:center;background:#fff7e9;border:1px solid #ecd9b4;border-radius:10px;
    padding:10px 12px;margin:0 2px 12px;}

  @media (prefers-reduced-motion:reduce){
    .stamp.pop{animation:none;transform:scale(1) rotate(-3deg);opacity:1;}
    .ring.go{animation:none;}
  }
</style>
</head>

  var PRIZE={
    1:{cls:"hit", img:IMG_SAND, big:"当たり", small:"マルセイ<br>バターサンド", label:"当たり", win:true},
    0:{cls:"miss", label:"はずれ", win:false}
  };

  /* ---- 座標 ---- */
  var MX=20, TOP=30, GAP, ROW=13;
  var W=656;
  GAP=(W-MX*2)/(N-1);
  var bottomY=TOP+L*ROW;
  function colX(i){return MX+i*GAP;}

  var SVGNS="http://www.w3.org/2000/svg";
  var svg=document.getElementById("svg");
  function el(t,a){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}

  for(var c=0;c<N;c++){svg.appendChild(el("line",{class:"col",x1:colX(c),y1:TOP,x2:colX(c),y2:bottomY}));}
  for(var lv=0;lv<L;lv++){for(var ii=0;ii<N-1;ii++){if(rungs[lv][ii]){var y=TOP+(lv+1)*ROW;svg.appendChild(el("line",{class:"rung",x1:colX(ii),y1:y,x2:colX(ii+1),y2:y}));}}}
  var caps=[];
  for(var d=0;d<N;d++){var cap=el("circle",{class:"cap",cx:colX(d),cy:bottomY,r:5});caps.push(cap);svg.appendChild(cap);}
  for(var t=0;t<N;t++){var lb=el("text",{class:"startlbl",x:colX(t),y:TOP-9});lb.textContent=(t+1);svg.appendChild(lb);}
  var trace=el("polyline",{id:"trace",points:""}); svg.appendChild(trace);
  var tip=el("circle",{id:"tip",cx:colX(0),cy:TOP,r:6,visibility:"hidden"}); svg.appendChild(tip);

  function pathPoints(start){
    var pts=[[colX(start),TOP]]; var col=start;
    for(var lv=0;lv<L;lv++){
      var yN=TOP+(lv+1)*ROW, ncol=col;
      if(col-1>=0&&rungs[lv][col-1])ncol=col-1;
      else if(col<=N-2&&rungs[lv][col])ncol=col+1;
      pts.push([colX(col),yN]);
      if(ncol!==col)pts.push([colX(ncol),yN]);
      col=ncol;
    }
    return {pts:pts,end:col};
  }

  /* ---- UI要素 ---- */
  var pick=document.getElementById("pick");
  var banner=document.getElementById("banner");
  var stamp=document.getElementById("stamp");
  var ring=document.getElementById("ring");
  var actions=document.getElementById("actions");
  var tally=document.getElementById("tally");
  var nameInput=document.getElementById("nameInput");
  var shareStatus=document.getElementById("shareStatus");
  var liveGrid=document.getElementById("liveGrid");
  var buttons=[], animating=false, current=null;

  for(var n=1;n<=N;n++){(function(n){
    var btn=document.createElement("button");
    btn.className="num"; btn.type="button"; btn.textContent=n;
    btn.setAttribute("aria-label",n+"番");
    btn.addEventListener("click",function(){ choose(n-1,btn); });
    buttons.push(btn); pick.appendChild(btn);
  })(n);}

  /* ---- 共有バックエンド（Firebase / 無ければローカル） ---- */
  var db=null, SHARED=false, picksRef=null, remote={}, localPicks={};
  function setStatus(msg,ok){ shareStatus.className="share-status"+(ok?" ok":""); shareStatus.textContent="共有："+msg; }
  (function initShare(){
    try{
      if(window.firebase && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf("ここに")<0){
        firebase.initializeApp(FIREBASE_CONFIG);
        db=firebase.database();
        picksRef=db.ref("rooms/"+ROOM+"/picks");
        SHARED=true;
        setStatus("接続中…",false);
        picksRef.on("value",function(snap){
          remote=snap.val()||{}; renderBoard(); setStatus("接続済み（リアルタイム）",true);
        },function(){ SHARED=false; setStatus("接続できません。各自の端末だけで表示します",false); renderBoard(); });
      }else{
        setStatus("オフ（設定すると全員で共有できます）",false);
      }
    }catch(e){ SHARED=false; setStatus("設定エラー。各自の端末だけで表示します",false); }
    renderBoard();
  })();

  function curData(){ return SHARED?remote:localPicks; }
  function getName(){ return (nameInput&&nameInput.value||"").trim().slice(0,12); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch];}); }

  function renderBoard(){
    var data=curData();
    var nums=Object.keys(data).map(Number).filter(function(x){return x>=1&&x<=N;}).sort(function(a,b){return a-b;});
    liveGrid.innerHTML="";
    if(nums.length===0){
      var em=document.createElement("div"); em.className="live-empty";
      em.textContent = SHARED? "まだ誰も引いていません。" : "まだ引いていません。";
      liveGrid.appendChild(em);
    }else{
      nums.forEach(function(nm){
        var dd=data[nm], p=PRIZE[dd&&dd.r]||PRIZE[0];
        var chip=document.createElement("div"); chip.className="chip "+(p.win?p.cls:"miss");
        var resTxt=p.win?p.label:"はずれ";
        chip.innerHTML='<b>'+nm+'</b>'+((dd&&dd.name)?'<span class="who">'+esc(dd.name)+'</span>':'')+'<span class="res">'+resTxt+'</span>';
        liveGrid.appendChild(chip);
      });
    }
    var drawn=nums.length;
    var hits=nums.filter(function(nm){return data[nm].r==1;}).length;
    tally.innerHTML = drawn
      ? ('引いた人：<b>'+drawn+'</b>/31　　当たり <b>'+hits+'</b>/16')
      : (SHARED? '引いた人：<b>0</b>/31　　当たり 0/16' : 'まだ引いていません');
    buttons.forEach(function(btn,i){
      var dd=data[i+1], p=dd?(PRIZE[dd.r]||PRIZE[0]):null;
      btn.classList.toggle("taken",!!dd);
      btn.classList.toggle("taken-hit",!!(p&&p.cls==="hit"));
    });
  }

  function recordPick(idx,code){
    var num=String(idx+1), name=getName();
    if(SHARED && picksRef){
      db.ref("rooms/"+ROOM+"/picks/"+num).transaction(function(cur){
        if(cur) return;                 // 既に誰かが引いている→そのまま
        return {r:code, name:name||null, ts:Date.now()};
      });
    }else{
      if(!localPicks[num]) localPicks[num]={r:code, name:name||null, ts:Date.now()};
      renderBoard();
    }
  }

  function clearActive(){buttons.forEach(function(b){b.classList.remove("active");});}

  var nameHint=document.getElementById("nameHint");
  function requireName(){
    if(nameInput){
      nameInput.classList.remove("need");   // アニメ再発火用
      void nameInput.offsetWidth;
      nameInput.classList.add("need");
      nameInput.focus();
    }
    if(nameHint) nameHint.classList.add("show");
  }
  if(nameInput){
    nameInput.addEventListener("input",function(){
      nameInput.classList.remove("need");
      if(nameHint) nameHint.classList.remove("show");
    });
  }

  function choose(idx,btn){
    if(animating) return;
    if(!getName()){ requireName(); return; }
    clearActive(); btn.classList.add("active");
    current=idx;
    banner.classList.remove("show"); stamp.className="stamp"; ring.className="ring";
    actions.classList.remove("show");
    caps.forEach(function(c){c.classList.remove("hit","miss");});
    animatePath(pathPoints(idx),btn);
  }

  function animatePath(pp,btn){
    animating=true;
    var pts=pp.pts, segs=[], total=0;
    for(var i=1;i<pts.length;i++){var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1];var dd=Math.hypot(dx,dy);segs.push(dd);total+=dd;}
    tip.setAttribute("visibility","visible");
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    var DUR=reduce?0:1450, t0=null;
    function frame(ts){
      if(t0===null)t0=ts;
      var p=DUR===0?1:Math.min(1,(ts-t0)/DUR);
      var e=1-Math.pow(1-p,2);
      var dist=e*total, acc=0;
      var drawn=[pts[0].slice()], tipXY=pts[pts.length-1];
      for(var i=1;i<pts.length;i++){
        if(acc+segs[i-1]>=dist){
          var r=(dist-acc)/segs[i-1];
          var x=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*r, y=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*r;
          drawn.push([x,y]); tipXY=[x,y]; break;
        }else{ drawn.push(pts[i].slice()); acc+=segs[i-1]; }
      }
      trace.setAttribute("points",drawn.map(function(q){return q[0]+","+q[1];}).join(" "));
      tip.setAttribute("cx",tipXY[0]); tip.setAttribute("cy",tipXY[1]);
      if(p<1){requestAnimationFrame(frame);} else { animating=false; reveal(pp.end,btn); }
    }
    requestAnimationFrame(frame);
  }

  function reveal(end,btn){
    var code=bottom[end], p=PRIZE[code], win=p.win;
    var already=!!curData()[String(current+1)];
    caps[end].classList.add(win?"hit":"miss");
    banner.innerHTML=(current+1)+'番は … <b>'+(win?(p.label+'！'):'はずれ')+'</b>'+(already?' <span class="note">（すでに引き済み）</span>':'');
    banner.classList.add("show");
    if(win){
      stamp.className="stamp win "+p.cls+" pop";
      stamp.innerHTML='<img class="prize-img" src="'+p.img+'" alt="">'+'<span class="big">'+p.big+'</span><span class="small">'+p.small+'</span>';
      ring.className="ring go";
    }else{
      stamp.className="stamp miss pop";
      stamp.innerHTML='<span class="big">はずれ</span>';
      ring.className="ring";
    }
    actions.classList.add("show");
    btn.classList.remove("active");
    if(!already) recordPick(current,code);
    if(navigator.vibrate){ navigator.vibrate(win?[0,40,60,40]:30); }
  }

  function clearDisplay(){
    clearActive();
    trace.setAttribute("points","");
    tip.setAttribute("visibility","hidden");
    banner.classList.remove("show");
    stamp.className="stamp"; ring.className="ring";
    actions.classList.remove("show");
    caps.forEach(function(c){c.classList.remove("hit","miss");});
    current=null;
  }

  document.getElementById("fullreset").addEventListener("click",function(){
    if(animating) return;
    var ok=window.confirm("全員の記録を消して最初からにします。よろしいですか？\n（これまで引いた結果の記録がすべて消えます）");
    if(!ok) return;
    if(SHARED && picksRef){ picksRef.remove(); }
    localPicks={};
    clearDisplay();
    renderBoard();
    window.scrollTo({top:0,behavior:"smooth"});
  });
})();
</script>
